---
testoverride:
  ignore:
    # Coraza is not reached, or accepts what the reference backend rejects.
    "^920100-4$": invalid uri, Coraza not reached
    "^920100-5$": invalid uri, Coraza not reached
    "^920100-8$": a colon in the path is rejected by Apache but legal for net/http
    "^920280-3$": HTTP/0.9 request, Coraza not reached
    "^920430-3$": HTTP/0.9 request, Coraza not reached
    "^920430-5$": request without a version, Coraza not reached
    "^920430-8$": net/http answers HTTP/4.0 with 505 before the rule runs
    "^920430-9$": HTTP/0.8 request, Coraza not reached
    "^920610-2$": net/http accepts the raw URL fragment the test expects to be rejected
    # The rule works, but the test asserts the status code Apache would return.
    "^920270-4$": rule matches, the test expects Apache to answer 400
    "^920274-1$": rule matches, the test expects Apache to answer 400
    # A different rule of the same family matches first.
    "^920290-1$": 920280 (missing Host header) matches instead of 920290
    "^920290-4$": 920280 (missing Host header) matches instead of 920290
    "^920620-1$": net/http keeps the duplicate Content-Type headers separate
    "^922130-1$": 200003 (multipart strict error) matches at parsing time instead
    "^922130-2$": 200003 (multipart strict error) matches at parsing time instead
    "^922130-7$": 200003 (multipart strict error) matches at parsing time instead
