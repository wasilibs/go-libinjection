name: Benchmark
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: curioswitch/go-build/.github/actions/setup-go@432d6c326402347b1f6ec5875fbdda8d0cedc54d # v0.10.0

      # Needed for the cgo benchmark mode run by bench-all / wafbench-all.
      - name: setup libinjection for cgo
        run: |-
          wget https://github.com/libinjection/libinjection/archive/211782219663f889f471650150df12b623c5766e.tar.gz
          tar -xf 211782219663f889f471650150df12b623c5766e.tar.gz
          cd libinjection-211782219663f889f471650150df12b623c5766e
          ./autogen.sh
          ./configure
          make
          sudo make install
        working-directory: /tmp

      - run: go run ./build bench-all
        env:
          LD_LIBRARY_PATH: /usr/local/lib

      - run: go run ./build wafbench-all
        env:
          LD_LIBRARY_PATH: /usr/local/lib

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results
          path: out/*bench*.txt
